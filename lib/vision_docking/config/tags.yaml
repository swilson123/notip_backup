# AprilTag family, detector tuning, and per-tag ramp geometry.
# Parsed by vision_docking.config.load_tags_config() into a TagsConfig.
# All units are SI (metres, degrees) unless otherwise noted.

tags:
  # AprilTag family used for every tag in this deployment. All tags on
  # the ramp must currently share one family -- see detector.py's TODO
  # about multi-family support.
  family: "tag36h11"

  # Fallback pose-tag size (physical edge length of a tag's black
  # border, in metres) for any tag *not* listed in known_tags below.
  # Every tag currently on the ramp (ids 0-2) has its own explicit
  # pose_tag_size_m in known_tags and does not use this default -- it
  # only matters for a future tag added without a known_tags entry.
  default_size_m: 0.10

  # Detector tuning, passed straight through to the AprilTag detector by
  # detector.py's AprilTagDetector -- and to pose.py's TagPoseEstimator
  # too (both must share this same tuning; see tag_fusion.py's module
  # docstring for why a second, inconsistently-tuned detector instance
  # was a past mistake this config prevents from recurring).
  detector:
    # Image-pyramid decimation factor. Higher values detect smaller/
    # farther-away tags at lower CPU cost but reduced corner precision;
    # 1.0 disables decimation entirely.
    quad_decimate: 2.0

    # Gaussian blur sigma applied before quad thresholding. 0.0 disables
    # blurring; small values (~0.8) can help with noisy sensors.
    quad_sigma: 0.0

    # Number of threads the detector may use internally.
    nthreads: 2

    # Reject any detection whose decision margin (detector confidence)
    # falls below this value. Raise this if false-positive detections
    # occur in the deployment environment; lower it if valid far-range
    # detections are being discarded.
    min_decision_margin: 35.0

    # Whether the detector performs a subpixel edge-refinement pass
    # after the initial quad detection. Improves corner precision (and
    # therefore pose accuracy once pose.py exists) at a small CPU cost.
    refine_edges: true

    # Sharpening applied to the decoded tag payload before the
    # Hamming-code check; higher values help at long range/low
    # resolution but can misdecode on very noisy images. 0.0 disables it.
    decode_sharpening: 0.25

    # Enables pupil-apriltags' own debug image dump (quad/segmentation
    # visualizations written to disk by the C library). Leave false
    # outside of detector-tuning sessions.
    debug: false

  # Known tags and their fixed pose on the docking ramp, expressed in
  # the ramp's own reference frame (see tag_fusion.py, which uses this
  # to transform each tag's camera-frame pose into a single ramp pose).
  #
  # Current ramp layout (3 tags, all the same large 5.000in card): id 0
  # sits directly on the ramp centerline at the entrance, id 1 at the
  # centerline's middle, id 2 at the centerline's top -- see
  # tag_fusion.py's module docstring, "Three-tag centerline model"
  # section, for exactly how each tag's own reconstruction role works
  # and why there are no more left/right tag pairs. Generated by
  # scripts/generate_tags.py -- see generated_tags/README.md for full
  # size derivations.
  #
  # Every entry below has two distinct size fields -- do not confuse
  # them:
  #   overall_size_m   -- the complete printed card, incl. white border.
  #   pose_tag_size_m  -- the black tag36h11 border square only; this is
  #                       the value pupil-apriltags needs for pose
  #                       estimation. An incorrect pose_tag_size_m scales
  #                       the entire estimated pose and is a common
  #                       source of docking error.
  known_tags:
    - id: 0
      role: "entrance-center"
      overall_size_m: 0.1270    # 5.000in printed card, incl. white border
      pose_tag_size_m: 0.09525  # 3.75in black-border pattern -- feed THIS to pupil-apriltags
      # Position of this tag's centre in the ramp frame, metres.
      # TODO(vision-docking): not yet measured on the physical ramp.
      position_m: [0.0, 0.0, 0.0]
      # Orientation of this tag in the ramp frame, as Euler angles in
      # degrees, applied in XYZ order.
      # TODO(vision-docking): not yet measured on the physical ramp.
      rotation_deg: [0.0, 0.0, 0.0]

    - id: 1
      role: "middle-center"
      overall_size_m: 0.1270
      pose_tag_size_m: 0.09525
      position_m: [0.0, 0.0, 0.0]  # TODO(vision-docking): not yet measured
      rotation_deg: [0.0, 0.0, 0.0]  # TODO(vision-docking): not yet measured

    - id: 2
      role: "top-center"
      overall_size_m: 0.1270
      pose_tag_size_m: 0.09525
      position_m: [0.0, 0.0, 0.0]  # TODO(vision-docking): not yet measured
      rotation_deg: [0.0, 0.0, 0.0]  # TODO(vision-docking): not yet measured
